server:
  port: 8081
spring:
  datasource:
    url: jdbc:h2:file:./data/supportdesk;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info
server.error.include-message: never
